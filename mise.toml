[tools]
node = "26.7.0"
"npm:pnpm" = "11.17.0"
"npm:esbuild" = "0.28.1"
"github:denoland/celld" = "0.2.1"

[env]
_.file = { path = ".env", redact = true }

[tasks.setup]
description = "Install the Cloudflare OS workspace dependencies"
run = "pnpm install"

[tasks.celld-router-spike-deploy]
description = "Deploy the diagnostic backend, then the real router, to celld"
run = '''
test -n "${CELLD_BUCKET:-}" || {
  echo "Set CELLD_BUCKET in .env (use a dedicated bucket prefix for this spike)." >&2
  exit 1
}
celld deploy portability/celld/router-spike/backend
celld deploy portability/celld/router-spike/router
'''

[tasks.celld-router-spike-serve]
description = "Serve the celld router spike on localhost:8790"
run = '''
test -n "${CELLD_BUCKET:-}" || {
  echo "Set CELLD_BUCKET in .env (use the same prefix used for deployment)." >&2
  exit 1
}
celld --bucket "$CELLD_BUCKET" --listen "${CELLD_LISTEN_ADDR:-127.0.0.1:8790}"
'''

[tasks.celld-router-spike-smoke]
description = "Verify router assets and its service binding to the diagnostic backend"
run = "node portability/celld/router-spike/smoke.mjs"

[tasks.celld-app-build]
description = "Build the real Cloudflare OS frontend and validated backend for celld"
run = '''
pnpm --filter @gadgets/typed-storage build
pnpm --filter @gadgets/workshop-frontend exec vite build
pnpm --filter @gadgets/workshop-backend build:worker
node portability/celld/app/prepare.mjs
'''

[tasks.celld-app-check]
description = "Bundle the real Cloudflare OS backend and router with celld without deploying"
depends = ["celld-app-build"]
run = '''
celld deploy portability/celld/app/backend --dry-run
celld deploy portability/celld/app/router --dry-run
'''

[tasks.celld-app-deploy]
description = "Build and deploy the real Cloudflare OS backend and router to celld"
depends = ["celld-app-build"]
run = '''
test -n "${CELLD_BUCKET:-}" || {
  echo "Set CELLD_BUCKET in .env." >&2
  exit 1
}
celld deploy portability/celld/app/backend
celld deploy portability/celld/app/router
'''

[tasks.celld-app-serve]
description = "Serve the real Cloudflare OS celld deployment on localhost:8790"
run = '''
test -n "${CELLD_BUCKET:-}" || {
  echo "Set CELLD_BUCKET in .env." >&2
  exit 1
}
test -x ../celld/target/lab/celld || {
  echo "Build the sibling celld fork first: cd ../celld && mise run build" >&2
  exit 1
}
../celld/target/lab/celld --bucket "$CELLD_BUCKET" --listen "${CELLD_LISTEN_ADDR:-127.0.0.1:8790}"
'''
